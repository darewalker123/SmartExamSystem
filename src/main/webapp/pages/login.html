<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | SmartExamSystem</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="auth">
  <main class="panel auth-box">
    <h1>SmartExamSystem</h1>
    <p>Login to continue to your role-based dashboard.</p>
    <form>
      <label>Email</label>
      <input name="email" type="email" required autocomplete="email">
      <label>Password</label>
      <input name="password" type="password" required autocomplete="current-password">
      <div class="actions">
        <button type="submit">Login</button>
        <a class="btn secondary" href="register.html">Register</a>
      </div>
      <div id="message" class="message"></div>
    </form>
    <p class="muted">Demo: admin@exam.com, teacher@exam.com, student@exam.com. Passwords: admin123, teacher123, student123.</p>
  </main>
  <script src="../assets/js/app.js"></script>
  <script>bindAuthPage('login');</script>
</body>
</html>
